services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://archive:archive@db:5432/archive
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: archive
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive"]
      interval: 2s
      timeout: 2s
      retries: 20
